# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Lint (version restatements, ESLint with the complexity ceilings,
# Prettier, npm audit), the tests at 100% coverage on Node.js 22 and 24,
# and the files npm would pack. `make check` runs the lint and test
# commands locally.
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Versions, lint, complexity, format, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Locked dependencies
        run: make install
      - name: Version restatements agree
        run: make versions
      - name: ESLint and the complexity ceilings
        run: make lint
      - name: Prettier
        run: make format-check
      - name: Known vulnerabilities (npm audit)
        run: make audit

  test:
    name: Tests and coverage (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Locked dependencies
        run: make install
      - name: Tests, gate at 100% coverage
        run: make test
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Packed files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: npm pack ships the executable, the source and the licences only
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const [pack] = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const files = pack.files.map((f) => f.path).sort();
            console.log(files.join("\n"));
            const allowed = /^(bin\/|src\/|LICENSE-(APACHE|MIT)$|README\.md$|package\.json$)/;
            const extra = files.filter((f) => !allowed.test(f));
            if (extra.length) { console.error("unexpected:", extra); process.exit(1); }
          ' "$RUNNER_TEMP/pack.json"
